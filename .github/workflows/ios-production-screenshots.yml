name: iOS Production Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-production-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Production iPhone and iPad screenshots
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT: catenary-ios.xcodeproj
      SCHEME: catenary-ios
      CONFIGURATION: Release
      BUNDLE_ID: org.catenarymaps.maps
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-production-screenshots
      SOURCE_PACKAGES: ${{ github.workspace }}/SourcePackages-production-screenshots
      BUILD_LOG: ${{ github.workspace }}/xcodebuild-production-screenshots.log
      SCREENSHOT_DIR: ${{ github.workspace }}/production-screenshots
      SCREENSHOT_READY_TIMEOUT_SECONDS: "90"
      SCREENSHOT_RETRY_SECONDS: "3"
      SCREENSHOT_MAX_ATTEMPTS: "4"
      SCREENSHOT_MIN_BYTES: "100000"

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: ios-production-screenshots-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('catenary-ios.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            ios-production-screenshots-swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Xcode build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-production-screenshots-derived-data-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('catenary-ios.xcodeproj/project.pbxproj', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ios-production-screenshots-derived-data-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('catenary-ios.xcodeproj/project.pbxproj', '**/Package.resolved') }}-
            ios-production-screenshots-derived-data-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Create latest iPhone and iPad simulators
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          runtime_line="$(
            xcrun simctl list runtimes available -j | jq -r '
              [
                .runtimes[]
                | select(.identifier | contains("SimRuntime.iOS-"))
                | . + {versionParts: (.version | split(".") | map(tonumber))}
              ]
              | sort_by(.versionParts)
              | last
              | [.version, .identifier]
              | @tsv
            '
          )"

          ios_version="$(cut -f1 <<< "$runtime_line")"
          runtime_id="$(cut -f2 <<< "$runtime_line")"

          if [[ -z "$ios_version" || -z "$runtime_id" ]]; then
            echo "No available iOS simulator runtime found."
            exit 1
          fi

          iphone_type_id="$(
            xcrun simctl list devicetypes -j | jq -r '
              [
                .devicetypes[]
                | select(.name | test("^iPhone [0-9]+ Pro$"))
                | . + {
                    generation: (
                      .name
                      | capture("^iPhone (?<generation>[0-9]+) Pro$")
                      | .generation
                      | tonumber
                    )
                  }
              ]
              | sort_by(.generation)
              | last
              | .identifier // empty
            '
          )"

          if [[ -z "$iphone_type_id" ]]; then
            iphone_type_id="$(
              xcrun simctl list devicetypes -j | jq -r '
                [.devicetypes[] | select(.name | startswith("iPhone"))]
                | last
                | .identifier // empty
              '
            )"
          fi

          ipad_type_id="$(
            xcrun simctl list devicetypes -j | jq -r '
              [
                .devicetypes[]
                | select(.name | test("^iPad Pro 13-inch \\(M[0-9]+\\)$"))
                | . + {
                    generation: (
                      .name
                      | capture("\\(M(?<generation>[0-9]+)\\)$")
                      | .generation
                      | tonumber
                    )
                  }
              ]
              | sort_by(.generation)
              | last
              | .identifier // empty
            '
          )"

          if [[ -z "$ipad_type_id" ]]; then
            ipad_type_id="$(
              xcrun simctl list devicetypes -j | jq -r '
                [.devicetypes[] | select(.name | startswith("iPad Pro"))]
                | last
                | .identifier // empty
              '
            )"
          fi

          if [[ -z "$iphone_type_id" || -z "$ipad_type_id" ]]; then
            echo "Could not resolve both an iPhone and iPad simulator device type."
            exit 1
          fi

          iphone_udid="$(
            xcrun simctl create \
              "Catenary Production Screenshots iPhone iOS $ios_version" \
              "$iphone_type_id" \
              "$runtime_id"
          )"
          ipad_udid="$(
            xcrun simctl create \
              "Catenary Production Screenshots iPad iOS $ios_version" \
              "$ipad_type_id" \
              "$runtime_id"
          )"

          echo "IOS_VERSION=$ios_version" >> "$GITHUB_ENV"
          echo "IOS_RUNTIME_ID=$runtime_id" >> "$GITHUB_ENV"
          echo "IPHONE_UDID=$iphone_udid" >> "$GITHUB_ENV"
          echo "IPAD_UDID=$ipad_udid" >> "$GITHUB_ENV"

          echo "Using iOS $ios_version"
          echo "iPhone simulator: $iphone_udid"
          echo "iPad simulator: $ipad_udid"

      - name: Boot simulators
        shell: bash
        run: |
          set -euo pipefail

          # Boot both devices first, then wait for both in parallel. Waiting for
          # each simulator serially was adding several minutes to every run.
          for udid in "$IPHONE_UDID" "$IPAD_UDID"; do
            xcrun simctl boot "$udid"
          done

          iphone_boot_pid=""
          ipad_boot_pid=""
          xcrun simctl bootstatus "$IPHONE_UDID" -b &
          iphone_boot_pid=$!
          xcrun simctl bootstatus "$IPAD_UDID" -b &
          ipad_boot_pid=$!

          wait "$iphone_boot_pid"
          wait "$ipad_boot_pid"

      - name: Prepare Xcode and SwiftPM state
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -rf "$HOME/Library/org.swift.swiftpm"
          rm -rf "$HOME/.swiftpm"
          rm -rf /tmp/org.swift.swiftpm

          mkdir -p "$DERIVED_DATA"
          mkdir -p "$SOURCE_PACKAGES"

          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          mkdir -p "$HOME/.swiftpm/cache/prebuilts"
          touch "$HOME/.swiftpm/cache/prebuilts/noprebuilts"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"

      - name: Build production screenshot app
        shell: bash
        run: |
          set -o pipefail

          # This is still the Release configuration (so DEBUG-only production
          # behavior stays off), but screenshots do not need whole-module
          # optimization or a multi-architecture simulator binary.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disableAutomaticPackageResolution \
            -parallelizeTargets \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="SCREENSHOT_AUTOMATION" \
            SWIFT_COMPILATION_MODE=incremental \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            ONLY_ACTIVE_ARCH=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$BUILD_LOG"

      - name: Capture requested screenshots
        shell: bash
        run: |
          set -euo pipefail

          app_path="$DERIVED_DATA/Build/Products/${CONFIGURATION}-iphonesimulator/Catenary.app"
          test -d "$app_path"
          mkdir -p "$SCREENSHOT_DIR/iphone" "$SCREENSHOT_DIR/ipad"

          run_with_timeout() {
            local seconds="$1"
            shift

            "$@" &
            local command_pid=$!

            (
              sleep "$seconds"
              if kill -0 "$command_pid" 2>/dev/null; then
                echo "::warning::Timed out after ${seconds}s: $*"
                kill -TERM "$command_pid" 2>/dev/null || true
                sleep 2
                kill -KILL "$command_pid" 2>/dev/null || true
              fi
            ) &
            local watchdog_pid=$!

            local status
            if wait "$command_pid"; then
              status=0
            else
              status=$?
            fi

            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
            return "$status"
          }

          boot_device() {
            local udid="$1"
            local family="$2"

            echo "::group::Boot $family simulator"
            run_with_timeout 30 xcrun simctl boot "$udid" || true
            run_with_timeout 120 xcrun simctl bootstatus "$udid" -b
            echo "::endgroup::"
          }

          prepare_device() {
            local udid="$1"
            local family="$2"

            echo "::group::Prepare $family simulator"
            run_with_timeout 15 xcrun simctl terminate "$udid" "$BUNDLE_ID" || true

            echo "Installing Catenary.app on $family..."
            if ! run_with_timeout 90 xcrun simctl install "$udid" "$app_path"; then
              echo "::warning::Install failed or timed out on $family; rebooting simulator and retrying once."
              run_with_timeout 30 xcrun simctl shutdown "$udid" || true
              run_with_timeout 30 xcrun simctl boot "$udid" || true
              run_with_timeout 120 xcrun simctl bootstatus "$udid" -b
              run_with_timeout 90 xcrun simctl install "$udid" "$app_path"
            fi

            run_with_timeout 30 xcrun simctl privacy "$udid" grant location "$BUNDLE_ID"
            run_with_timeout 30 xcrun simctl status_bar "$udid" override \
              --time 9:41 \
              --batteryState charged \
              --batteryLevel 100 \
              --wifiBars 3 \
              --cellularBars 4 || true
            echo "::endgroup::"
          }

          capture_screenshot() {
            local udid="$1"
            local output="$2"
            local user_location="$3"
            shift 3

            echo "Starting ${output#$SCREENSHOT_DIR/}..."
            run_with_timeout 15 xcrun simctl terminate "$udid" "$BUNDLE_ID" || true

            if [[ -n "$user_location" ]]; then
              run_with_timeout 15 xcrun simctl location "$udid" set "$user_location"
            else
              run_with_timeout 15 xcrun simctl location "$udid" clear || true
            fi

            local ready_token data_container ready_file deadline
            ready_token="$(uuidgen | tr '[:upper:]' '[:lower:]')"
            data_container="$(xcrun simctl get_app_container "$udid" "$BUNDLE_ID" data)"
            ready_file="$data_container/tmp/catenary-screenshot-ready-$ready_token"
            rm -f "$ready_file"

            run_with_timeout 30 xcrun simctl launch "$udid" "$BUNDLE_ID" \
              --ci-screenshot-ready-token "$ready_token" \
              "$@"

            echo "Waiting for SCREENSHOT_READY $ready_token..."
            deadline=$((SECONDS + SCREENSHOT_READY_TIMEOUT_SECONDS))
            while [[ ! -f "$ready_file" ]]; do
              if (( SECONDS >= deadline )); then
                echo "::error::Timed out waiting for drawer data and fully rendered map tiles: ${output#$SCREENSHOT_DIR/}"
                return 1
              fi
              sleep 0.25
            done
            echo "SCREENSHOT_READY $ready_token"

            local attempt bytes
            for (( attempt = 1; attempt <= SCREENSHOT_MAX_ATTEMPTS; attempt++ )); do
              run_with_timeout 30 xcrun simctl io "$udid" screenshot "$output"
              bytes="$(stat -f%z "$output")"

              if (( bytes >= SCREENSHOT_MIN_BYTES )); then
                echo "Captured ${output#$SCREENSHOT_DIR/} (${bytes} bytes, attempt $attempt)"
                return 0
              fi

              if (( attempt == SCREENSHOT_MAX_ATTEMPTS )); then
                echo "Screenshot still looks blank after $attempt attempts: $output (${bytes} bytes)"
                return 1
              fi

              echo "Screenshot looks blank (${bytes} bytes); retrying ${output#$SCREENSHOT_DIR/}..."
              sleep "$SCREENSHOT_RETRY_SECONDS"
            done
          }

          capture_device() {
            local udid="$1"
            local family="$2"
            local dir="$SCREENSHOT_DIR/$family"

            capture_screenshot \
              "$udid" \
              "$dir/01-grand-central-midway.png" \
              "" \
              --ci-screenshot-map "40.7531,-73.98159,12" \
              --ci-screenshot-deep-link "https://maps.catenarymaps.org/?page=osm_station&osm_id=7099182377&name=Grand+Central+Terminal" \
              --ci-screenshot-drawer midway

            capture_screenshot \
              "$udid" \
              "$dir/02-munich-hbf-expanded.png" \
              "" \
              --ci-screenshot-deep-link "https://maps.catenarymaps.org/?page=osm_station&osm_id=2470201868&name=M%C3%BCnchen+Hbf" \
              --ci-screenshot-drawer expanded

            capture_screenshot \
              "$udid" \
              "$dir/03-st-pancras-nearby-midway.png" \
              "51.53214505504545,-0.12611027769636962" \
              --ci-screenshot-user-location "51.53214505504545,-0.12611027769636962" \
              --ci-screenshot-map "51.53214505504545,-0.12611027769636962,15" \
              --ci-screenshot-deep-link "https://maps.catenarymaps.org/?page=nearby_departures&lat=51.53214505504545&lon=-0.12611027769636962" \
              --ci-screenshot-drawer midway

            capture_screenshot \
              "$udid" \
              "$dir/04-louvre-collapsed.png" \
              "48.8604024,2.3385987" \
              --ci-screenshot-user-location "48.8604024,2.3385987" \
              --ci-screenshot-map "48.8604024,2.3385987,13.5" \
              --ci-screenshot-drawer collapsed
          }

          # Capture on one simulator at a time. Both devices were booted earlier
          # for build setup, so shut the iPad down before touching the iPhone.
          run_with_timeout 30 xcrun simctl shutdown "$IPAD_UDID" || true
          prepare_device "$IPHONE_UDID" iphone
          capture_device "$IPHONE_UDID" iphone

          run_with_timeout 15 xcrun simctl terminate "$IPHONE_UDID" "$BUNDLE_ID" || true
          run_with_timeout 30 xcrun simctl shutdown "$IPHONE_UDID" || true

          boot_device "$IPAD_UDID" iPad
          prepare_device "$IPAD_UDID" iPad
          capture_device "$IPAD_UDID" ipad

          for screenshot in "$SCREENSHOT_DIR"/*/*.png; do
            width="$(sips -g pixelWidth "$screenshot" | awk '/pixelWidth/ { print $2 }')"
            height="$(sips -g pixelHeight "$screenshot" | awk '/pixelHeight/ { print $2 }')"

            echo "${screenshot#$SCREENSHOT_DIR/}: ${width}x${height}"
            if (( height <= width )); then
              echo "Expected a portrait screenshot, but got ${width}x${height}: $screenshot"
              exit 1
            fi
          done

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-production-${{ env.IOS_VERSION }}-screenshots-${{ github.sha }}
          path: ${{ env.SCREENSHOT_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-production-screenshots
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: ignore
          retention-days: 7
